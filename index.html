<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI Personality Assessment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="toggle-mode" id="theme-btn">Toggle Theme</button>

    <div class="container">
        <h1>MBTI Personality Assessment</h1>
        <p class="subtitle">Select the option that best describes your behavior. There are no right or wrong answers.</p>

        <div id="progressBar">
            <div id="progress"></div>
        </div>

        <div id="quiz-container"></div>

        <div id="result" class="card">
            <div class="result-type" id="type"></div>
            <div class="description" id="desc"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
